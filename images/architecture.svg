<title id="t">HYDRA-UMC-BRIDGE-PRINTER3D architecture</title>
<desc id="d">HYDRA-UMC-BRIDGE-PRINTER3D reads the readiness of a Moonraker or Klipper printer, passes every job through the shared evaluate_job gate of HYDRA-UMC-SDK and, when the gate allows it, starts, pauses, resumes or cancels the print through Moonraker. It identifies print files without unpacking or running them and never controls firmware or heaters.</desc>
